[tools]
go        = "1.23"
node      = "22"
pnpm      = "9"
flutter   = "stable"
buf       = "latest"
sqlc      = "latest"
"go:github.com/golang-migrate/migrate/v4/cmd/migrate" = "latest"
"go:github.com/golangci/golangci-lint/cmd/golangci-lint" = "latest"

[env]
# golang-migrate selects its database drivers with build tags. A plain
# `go install` yields a binary that fails with "unknown driver postgres",
# and mise's go: backend has no per-tool build-tag option -- so set it here.
GOFLAGS = "-tags=postgres"
PG_DSN = "postgres://tinbela:tinbela@localhost:5432/tinbela?sslmode=disable"
TZ     = "Asia/Dhaka"
