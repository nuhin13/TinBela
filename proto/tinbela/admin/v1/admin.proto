syntax = "proto3";

package tinbela.admin.v1;

// READ-ONLY on customer data. The admin portal is a window, not a lever.
// The only writes in this service are feature flags.
service AdminService {
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc FindUser(FindUserRequest) returns (FindUserResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc GetFlags(GetFlagsRequest) returns (GetFlagsResponse);
  rpc SetFlag(SetFlagRequest) returns (SetFlagResponse);
}

message ListTenantsRequest { string query = 1; int32 page = 2; int32 page_size = 3; }
message ListTenantsResponse { repeated TenantSummary tenants = 1; int32 total = 2; }

message TenantSummary {
  string id = 1;
  string name = 2;
  string kind = 3;
  int32 member_count = 4;
  string created_at = 5;
  string last_activity_at = 6;
}

message GetTenantRequest { string tenant_id = 1; }
message GetTenantResponse {
  TenantSummary summary = 1;
  string members_json = 2;
  string ledger_json = 3;
  string exceptions_json = 4;
}

message FindUserRequest { string phone_e164 = 1; string firebase_uid = 2; }
message FindUserResponse { string user_json = 1; }

message GetMetricsRequest { string from = 1; string to = 2; }
message GetMetricsResponse {
  int32 active_messes = 1;
  int32 exceptions_today = 2;
  int32 closes_this_month = 3;
  int32 member_links_opened = 4;
}

message GetFlagsRequest {}
message GetFlagsResponse { map<string, bool> flags = 1; }
message SetFlagRequest { string key = 1; bool value = 2; }
message SetFlagResponse {}
