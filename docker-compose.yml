services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tinbela
      POSTGRES_PASSWORD: tinbela
      POSTGRES_DB: tinbela
      TZ: Asia/Dhaka
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinbela"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      PG_DSN: postgres://tinbela:tinbela@postgres:5432/tinbela?sslmode=disable
      HTTP_PORT: "8080"
      TZ: Asia/Dhaka
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]

volumes:
  pgdata:
  caddydata:
