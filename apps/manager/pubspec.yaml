name: tinbela_manager
description: "TinBela manager app — the daily mess loop, in Bangla."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # bn/en ARB strings. No hardcoded user-visible strings (apps/manager/AGENTS.md).
  intl: any

  # Runtime for the generated Dart message types in lib/core/api/gen.
  # Messages only — the transport is plain HTTP/JSON against Connect's JSON
  # codec, so there is deliberately no Connect Dart client here (ADR-0003).
  protobuf: ^6.0.0
  fixnum: ^1.1.1

  # The language choice on the welcome screen has to survive a restart, and
  # it is made before any account exists, so there is nowhere on the server
  # to keep it yet (task 09.1).
  shared_preferences: ^2.3.0

  # Messenger/WhatsApp deep links on the invite screen (task 09.5). No NDK:
  # this plugin is Kotlin, not native sources — see android/app/build.gradle.kts.
  url_launcher: ^6.3.0

  # Transport for the generated messages above. Connect's unary JSON protocol
  # is a POST with a JSON body, so this is the whole dependency -- see
  # core/api/connect_client.dart.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # runs gen-l10n from l10n.yaml on build
