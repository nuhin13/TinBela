name: ci

# This repo's default branch is master. The trigger said [main], so no
# push has ever started this workflow -- only pull_request could.
on:
  push: { branches: [master] }
  pull_request:

# CI runs exactly `make verify` — never a weaker subset. If it passes here
# it passes locally, and vice versa.
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tinbela
          POSTGRES_PASSWORD: tinbela
          POSTGRES_DB: tinbela
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_DSN: postgres://tinbela:tinbela@localhost:5432/tinbela?sslmode=disable
      TZ: Asia/Dhaka
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # buf breaking needs history

      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: services/api/go.sum }

      - uses: bufbuild/buf-setup-action@v1

      # `make lint` runs `pnpm lint` in apps/web, and `make contract` runs
      # the generated TypeScript client's tests. Both need node and pnpm.
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      - name: Install JS dependencies
        run: |
          pnpm --dir packages/api-clients install --frozen-lockfile
          pnpm --dir apps/web install --frozen-lockfile

      - name: Install tools
        run: |
          # -tags postgres, or the binary has no database drivers and
          # every migrate call fails with "unknown driver postgres".
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: make verify
        run: make verify

  flutter:
    runs-on: ubuntu-latest
    # Path-filtered so a backend change does not rebuild the app.
    if: contains(github.event.head_commit.modified, 'apps/manager') || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: |
          if [ -f apps/manager/pubspec.yaml ]; then
            cd apps/manager
            flutter pub get
            flutter analyze
            flutter test
          else
            echo "manager app not scaffolded yet (Epic 08)"
          fi
